name: 定时选股

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 👈 关键：授予写入权限

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行选股
        id: run
        run: |
          alphasift screen stable_income --no-llm --max-output 3 --save-run > out.txt

      - name: 发送到飞书（含持仓追踪）
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python scripts/send_feishu.py

      - name: 提交持仓数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add positions.json
          git commit -m "更新持仓数据 [skip ci]" || echo "无变更"
          git push
