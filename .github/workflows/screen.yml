name: 定时选股

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行选股
        id: run
        run: |
          alphasift screen resonance_20260823 --no-llm --max-output 10 --save-run > out.txt
          echo "SCREEN_OUTPUT<<EOF" >> $GITHUB_ENV
          cat out.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 发送到飞书
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "飞书 Webhook 未配置，跳过发送"
            exit 0
          fi
          # 构造 JSON 消息
          MESSAGE=$(cat <<'EOM'
          {
            "msg_type": "text",
            "content": {
              "text": "$(echo "$SCREEN_OUTPUT" | sed 's/"/\\"/g')"
            }
          }
          EOM
          )
          curl -X POST -H "Content-Type: application/json" -d "$MESSAGE" "$WEBHOOK_URL"
