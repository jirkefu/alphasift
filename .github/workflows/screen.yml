name: 定时选股

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行选股
        id: run
        run: |
          alphasift screen resonance_20260823 --no-llm --max-output 10 --save-run > out.txt
          cat out.txt
          echo "OUTPUT<<EOF" >> $GITHUB_ENV
          cat out.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 发送到飞书（带签名）
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          python -c "
import hmac
import hashlib
import base64
import json
import time
import os
import subprocess

webhook_url = os.environ['WEBHOOK_URL']
secret = os.environ.get('WEBHOOK_SECRET')
timestamp = int(time.time())

# 读取输出内容（限制长度）
with open('out.txt', 'r') as f:
    content = f.read()[:3000]

payload = {
    'msg_type': 'text',
    'content': {
        'text': f'📊 选股策略 (resonance_20260823) 结果：\n{content}'
    }
}

# 如果配置了签名，则添加 timestamp 和 sign
if secret:
    sign_str = f'{timestamp}\n{secret}'
    sign = base64.b64encode(hmac.new(secret.encode('utf-8'), sign_str.encode('utf-8'), hashlib.sha256).digest()).decode('utf-8')
    payload['timestamp'] = timestamp
    payload['sign'] = sign

cmd = ['curl', '-X', 'POST', '-H', 'Content-Type: application/json', '-d', json.dumps(payload), webhook_url]
subprocess.run(cmd, check=True)
"
