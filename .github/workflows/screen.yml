name: 定时选股

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行选股
        id: run
        run: |
          alphasift screen resonance_20260823 --no-llm --max-output 10 --save-run > out.txt
          cat out.txt

      - name: 发送到飞书
        uses: junka/feishu-bot-webhook-action@master
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK }}
          msg_type: text
          content: |
            选股结果：
            $(cat out.txt)
