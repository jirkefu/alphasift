name: 定时选股

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行选股
        id: run
        run: |
          alphasift screen resonance_20260823 --no-llm --max-output 10 --save-run > out.txt
          cat out.txt
          echo "OUTPUT<<EOF" >> $GITHUB_ENV
          cat out.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 发送到飞书
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          # 提取前20行并转义
          SUMMARY=$(cat out.txt | head -20 | sed 's/"/\\"/g' | awk '{printf "%s\\n", $0}')
          MESSAGE="📊 选股策略 (resonance_20260823) 结果：\\n${SUMMARY}"
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${MESSAGE}\"}}" \
            $WEBHOOK_URL
