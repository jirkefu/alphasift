name: 定时选股并发送到飞书

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install akshare

      - name: 执行选股策略
        id: screen
        run: |
          alphasift screen resonance_20260823 --no-llm --max-output 10 --save-run > screen_output.txt 2>&1
          echo "SCREEN_OUTPUT<<EOF" >> $GITHUB_ENV
          cat screen_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 发送选股结果到飞书
        if: steps.screen.outcome == 'success'
        uses: junka/feishu-bot-webhook-action@master
        with:
          webhook: ${{ secrets.FEISHU_WEBHOOK }}
          msg_type: text
          content: |
            📊 选股策略 (resonance_20260823) 结果如下：
            ${{ env.SCREEN_OUTPUT }}
