name: 定时选股

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 缓存 pip 依赖
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: 运行选股
        id: run
        run: |
          alphasift screen resonance_20260823 --no-llm --max-output 10 --save-run > out.txt
          cat out.txt
          echo "OUTPUT<<EOF" >> $GITHUB_ENV
          cat out.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 发送到飞书（带签名）
        env:
          WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: python scripts/send_feishu.py
